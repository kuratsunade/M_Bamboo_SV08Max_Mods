# M_Bamboo EAR Public Test Toolkit v0.1.1
# Public RC4-compatible contact-sequence / recovery test harness.
# Test layer only: does not modify or require modified klippy/extras Python backends.
# Maintainer: Master_Bamboo / 竹子
#
# CLEAN_MODE:
#   0 = skip cleaner stage
#   1 = cold contact + NC-R1-equivalent wipe motion, no nozzle heat
#   2 = heat nozzle to NOZZLE_TEMP, then contact + wipe motion
#
# Any Klipper command error aborts the current chain. When AUTO_EVALUATE=1,
# EAR-R3F automatically evaluates an Eddy transport fault with the existing
# no-motion recovery check. When AUTO_RECOVER=1 and the fault is classified
# TRANSIENT_RECOVERABLE, it may perform exactly one armed Safe Home G28 per
# recovery attempt, verify HEALTHY, then continue with a fresh soak attempt.
# The failed transaction and failed soak attempt remain permanently counted.
# It never retries the failed transaction and never issues FIRMWARE_RESTART.

# Public-toolkit compatibility hooks.
# HF1/HF2 used a Python EAR logger backend. Public v0.1.1 deliberately does not.
# Keep these commands as no-ops so the proven soak/matrix state machine stays compatible
# while all evidence comes from stock RC4 klippy.log/Moonraker logs.
[gcode_macro M_BAMBOO_EAR_LOG_START]
description: Public toolkit no-op compatibility hook
gcode:
    {% set label = params.LABEL|default("public") %}
    RESPOND MSG="EAR public log marker: START label={label}; backend logger not installed"

[gcode_macro M_BAMBOO_EAR_LOG_MARK]
description: Public toolkit no-op compatibility hook
gcode:
    RESPOND MSG="EAR public marker: {rawparams}"

[gcode_macro M_BAMBOO_EAR_LOG_STOP]
description: Public toolkit no-op compatibility hook
gcode:
    {% set reason = params.REASON|default("unspecified") %}
    RESPOND MSG="EAR public log marker: STOP reason={reason}; run collect_logs.sh for evidence"

