[gcode_macro M_BAMBOO_SOAK_START]
description: EAR-R3F transaction churn soak runner
# Example: M_BAMBOO_SOAK_START COUNT=10 TEST_MODE=CHURN BURST_COUNT=5 DWELL_MS=0
gcode:
    {% set count = params.COUNT|default(5)|int %}
    {% set bed = params.BED_TEMP|default(35)|float %}
    {% set nozzle = params.NOZZLE_TEMP|default(0)|float %}
    {% set clean = params.CLEAN_MODE|default(1)|int %}
    {% set qgl = params.QGL|default(1)|int %}
    {% set mesh = params.MESH|default(1)|int %}
    {% set between = params.BETWEEN|default(10)|float %}
    {% set keep_heat = params.KEEP_HEAT|default(0)|int %}
    {% set zdbg = params.ZDBG|default(0)|int %}
    {% set auto_m84 = params.AUTO_M84|default(1)|int %}
    {% set auto_evaluate = params.AUTO_EVALUATE|default(1)|int %}
    {% set auto_recover = params.AUTO_RECOVER|default(0)|int %}
    {% set test_mode_name = params.TEST_MODE|default("CHURN")|upper %}
    {% if test_mode_name != "CHURN" %}
        { action_raise_error("EAR-R3F supports TEST_MODE=CHURN only") }
    {% endif %}
    {% set test_mode = 8 %}
    {% set burst_count = params.BURST_COUNT|default(5)|int %}
    {% set contact_dwell_ms = params.DWELL_MS|default(0)|int %}
    {% set probe_x = params.X|default(241.10)|float %}
    {% set probe_y = params.Y|default(248.75)|float %}
    {% set stage_settle = params.STAGE_SETTLE|default(0)|float %}
    {% set max_auto_recoveries = params.MAX_AUTO_RECOVERIES|default(3)|int %}
    {% set max_consecutive = params.MAX_CONSECUTIVE_AUTO_RECOVERIES|default(1)|int %}
    {% set e = printer["probe_eddy_current eddy"] %}

    {% if printer["gcode_macro M_BAMBOO_SOAK_STATE"].running|int == 1 %}
        { action_raise_error("M_Bamboo soak is already running. Use M_BAMBOO_SOAK_STOP first.") }
    {% endif %}
    {% if printer["gcode_macro M_BAMBOO_SOAK_STATE"].ear_pending|int == 1 or printer["gcode_macro M_BAMBOO_SOAK_STATE"].recovery_pending|int == 1 %}
        { action_raise_error("SOAK START BLOCKED: EAR-R3F evaluation or automatic recovery is still pending. Use M_BAMBOO_SOAK_STATUS or M_BAMBOO_SOAK_STOP before starting a new run.") }
    {% endif %}
    {% if e.transport_state == "TRANSPORT_RECOVERED" and e.z_recovery_required %}
        { action_raise_error("SOAK START BLOCKED: Eddy transport recovered but Z trust is not restored. Run one G28 to complete the armed Safe Home recovery, verify M_BAMBOO_EDDY_STATUS is HEALTHY, then start soak again.") }
    {% endif %}
    {% if e.transport_state != "HEALTHY" or e.restart_required or e.z_recovery_required %}
        { action_raise_error("SOAK START BLOCKED: Eddy safety state is not HEALTHY. Inspect M_BAMBOO_EDDY_STATUS and complete the documented recovery path first.") }
    {% endif %}
    {% if count < 1 or count > 250 %}
        { action_raise_error("COUNT must be 1..250") }
    {% endif %}
    {% if bed < 0 or bed > 60 %}
        { action_raise_error("BED_TEMP must be 0..60C for this engineering soak toolkit") }
    {% endif %}
    {% if nozzle < 0 or nozzle > 260 %}
        { action_raise_error("NOZZLE_TEMP must be 0..260C") }
    {% endif %}
    {% if clean < 0 or clean > 2 %}
        { action_raise_error("CLEAN_MODE must be 0, 1, or 2") }
    {% endif %}
    {% if qgl not in [0, 1] or mesh not in [0, 1] or keep_heat not in [0, 1] or zdbg not in [0, 1] or auto_m84 not in [0, 1] or auto_evaluate not in [0, 1] or auto_recover not in [0, 1] %}
        { action_raise_error("QGL, MESH, KEEP_HEAT, ZDBG, AUTO_M84, AUTO_EVALUATE and AUTO_RECOVER must be 0 or 1") }
    {% endif %}
    {% if auto_recover == 1 and auto_evaluate != 1 %}
        { action_raise_error("AUTO_RECOVER=1 requires AUTO_EVALUATE=1") }
    {% endif %}
    {% if max_auto_recoveries < 0 or max_auto_recoveries > 25 %}
        { action_raise_error("MAX_AUTO_RECOVERIES must be 0..25") }
    {% endif %}
    {% if max_consecutive < 0 or max_consecutive > 5 %}
        { action_raise_error("MAX_CONSECUTIVE_AUTO_RECOVERIES must be 0..5") }
    {% endif %}
    {% if between < 2 or between > 600 %}
        { action_raise_error("BETWEEN must be 2..600 seconds") }
    {% endif %}
    {% if stage_settle < 0 or stage_settle > 10 %}
        { action_raise_error("STAGE_SETTLE must be 0..10 seconds") }
    {% endif %}
    {% if burst_count < 1 or burst_count > 20 %}
        { action_raise_error("BURST_COUNT must be 1..20") }
    {% endif %}
    {% if contact_dwell_ms < 0 or contact_dwell_ms > 3000 %}
        { action_raise_error("DWELL_MS must be 0..3000") }
    {% endif %}

    SET_GCODE_VARIABLE MACRO=M_BAMBOO_SOAK_STATE VARIABLE=running VALUE=